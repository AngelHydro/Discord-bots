<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discord Viewer</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="theme-color" content="#2b2d31">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Discord">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --bg:#313338; --side:#2b2d31; --text:#dbdee1; --muted:#949ba4; --hover:#2e3035; --accent:#5865f2; }
  * { box-sizing:border-box; }
  body { margin:0; display:flex; height:100vh; height:100dvh; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background:var(--bg); color:var(--text); font:15px/1.4 system-ui,sans-serif; }
  nav { width:260px; background:var(--side); overflow-y:auto; padding:8px; flex-shrink:0; }
  nav button { display:block; width:100%; text-align:left; background:none; border:0; color:var(--muted); padding:6px 8px; border-radius:4px; cursor:pointer; font:inherit; }
  nav button:hover, nav button.on { background:var(--hover); color:var(--text); }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  header { padding:8px 16px; border-bottom:1px solid #1f2023; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  #title { font-weight:600; flex:1; min-width:0; }
  header input { background:#1e1f22; color:var(--text); border:0; border-radius:4px; padding:6px 8px; font:inherit; width:220px; max-width:100%; }
  .banner { color:var(--muted); margin-bottom:12px; } .banner button { margin-left:8px; background:var(--hover); color:var(--text); border:0; padding:4px 10px; border-radius:4px; cursor:pointer; }
  #log { flex:1; overflow-y:auto; padding:16px; }
  #more { margin:0 auto 12px; display:block; background:var(--accent); color:#fff; border:0; padding:6px 12px; border-radius:4px; cursor:pointer; }
  .msg { display:flex; gap:12px; padding:4px 0; }
  .msg img.av { width:40px; height:40px; border-radius:50%; flex-shrink:0; }
  .who { font-weight:600; } .who small { color:var(--muted); font-weight:400; margin-left:6px; }
  .txt { white-space:pre-wrap; word-wrap:break-word; }
  .reply { color:var(--muted); font-size:13px; border-left:2px solid #4e5058; padding-left:6px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .edited { color:var(--muted); font-size:11px; margin-left:4px; }
  .reacts { display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; }
  .reacts span { background:#2b2d31; border-radius:8px; padding:1px 6px; font-size:13px; display:inline-flex; gap:4px; align-items:center; }
  .reacts img { width:16px; height:16px; }
  .msg.deleted .txt { text-decoration:line-through; color:var(--muted); }
  .msg.deleted .who::after { content:" — supprimé"; color:#f23f43; font-weight:400; font-size:12px; }
  .txt img { max-width:100%; max-height:240px; display:block; margin-top:4px; border-radius:4px; }
  @media (max-width:640px) { body { flex-direction:column; } nav { width:100%; max-height:30vh; } }
</style>
</head>
<body>
<nav id="channels"></nav>
<main>
  <header>
    <div id="title">Choisis un salon</div>
    <form id="search" hidden><input type="search" placeholder="Rechercher dans le salon…" aria-label="Rechercher"></form>
  </header>
  <div id="log"></div>
</main>
<script>
let current = null, oldest = null, searching = false;
const log = document.getElementById('log');

function render(m) {
  const row = document.createElement('div'); row.className = 'msg'; row.dataset.id = m.id;
  const av = document.createElement('img'); av.className = 'av'; av.src = m.avatar; av.alt = '';
  const body = document.createElement('div');
  const who = document.createElement('div'); who.className = 'who';
  who.textContent = m.author + (m.bot ? ' [BOT]' : '');
  const t = document.createElement('small'); t.textContent = new Date(m.time).toLocaleString('fr-FR');
  who.append(t);
  const txt = document.createElement('div'); txt.className = 'txt'; txt.textContent = m.content; // textContent = pas d'injection HTML
  if (m.edited) { const e = document.createElement('span'); e.className = 'edited'; e.textContent = '(modifié)'; txt.append(e); }
  for (const url of m.attachments) {
    const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener';
    if (/\.(png|jpe?g|gif|webp)(\?|$)/i.test(url)) { const i = document.createElement('img'); i.src = url; a.append(i); }
    else a.textContent = url.split('/').pop().split('?')[0];
    txt.append(a);
  }
  body.append(who);
  if (m.reply) {
    const r = document.createElement('div'); r.className = 'reply';
    r.textContent = '↪ ' + (m.reply.author ? m.reply.author + ' : ' : '') + m.reply.content;
    body.append(r);
  }
  body.append(txt);
  if (m.reactions.length) {
    const rs = document.createElement('div'); rs.className = 'reacts';
    for (const x of m.reactions) {
      const sp = document.createElement('span');
      if (x.url) { const i = document.createElement('img'); i.src = x.url; i.alt = x.emoji; i.title = x.emoji; sp.append(i); }
      else sp.append(x.emoji);
      sp.append(String(x.count)); rs.append(sp);
    }
    body.append(rs);
  }
  row.append(av, body);
  return row;
}

async function load(id, name) {
  current = id; oldest = null; searching = false; log.innerHTML = '';
  document.getElementById('title').textContent = name;
  form.hidden = false; form.querySelector('input').value = '';
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  await older();
  log.scrollTop = log.scrollHeight;
}

async function older() {
  const id = current;
  const msgs = await (await fetch(`/api/channels/${id}/messages` + (oldest ? `?before=${oldest}` : ''))).json();
  if (id !== current) return;
  document.getElementById('more')?.remove();
  const h = log.scrollHeight;
  log.prepend(...msgs.map(render));
  if (msgs.length) {
    oldest = msgs[0].id;
    const b = document.createElement('button'); b.id = 'more'; b.textContent = 'Messages plus anciens'; b.onclick = older;
    log.prepend(b);
  }
  log.scrollTop += log.scrollHeight - h;
}

const form = document.getElementById('search');
form.onsubmit = async e => {
  e.preventDefault();
  const q = form.querySelector('input').value.trim();
  if (!q || !current) return;
  const id = current, name = document.getElementById('title').textContent;
  searching = true; log.textContent = 'Recherche…';
  const res = await fetch(`/api/channels/${id}/search?q=${encodeURIComponent(q)}`);
  if (id !== current || !searching) return;
  const msgs = res.ok ? await res.json() : [];
  log.innerHTML = '';
  const b = document.createElement('div'); b.className = 'banner';
  b.textContent = `${msgs.length} résultat(s) pour « ${q} »`;
  const back = document.createElement('button'); back.textContent = 'Retour'; back.onclick = () => load(id, name);
  b.append(back); log.append(b, ...msgs.map(render));
};

(async () => {
  const nav = document.getElementById('channels');
  for (const c of await (await fetch('/api/channels')).json()) {
    const b = document.createElement('button'); b.textContent = c.name; b.dataset.id = c.id;
    b.onclick = () => load(c.id, c.name); nav.append(b);
  }
  new EventSource('/api/stream').onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.channel !== current) return;
    const row = log.querySelector(`.msg[data-id="${m.id}"]`);
    if (m.type === 'delete') { row?.classList.add('deleted'); return; }
    if (m.type === 'update') { if (row) row.replaceWith(render(m)); return; }
    if (searching) return;
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 50;
    log.append(render(m));
    if (atBottom) log.scrollTop = log.scrollHeight;
  };
})();
</script>
</body>
</html>
